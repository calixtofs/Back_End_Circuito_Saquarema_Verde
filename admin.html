<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Circuito Saquarema Verde</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cabin+Sketch:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>

    <header>
        <a href="index.html" class="header-logo">
            <svg class="leaf-icon" viewBox="0 0 24 24">
                <path d="M17 8c-1.66-1.66-4.66-2.02-7-.75C8.34 8.79 7 11.5 7 14c0 3 2 6 6 6s6-3 6-6c0-2.5-1.34-5.21-3-7zM8 12c.5-1.5 1.5-2.5 3-3 .75-.38 1.5-.75 2.25-1.13.75.38 1.5.75 2.25-1.13C16 4 14 2 12 2S8 4 8 8c0 2.5 1.34-5.21 3 7 .75.38 1.5.75 2.25 1.13.75.38 1.5.75 2.25 1.13C16 20 14 22 12 22S8 20 8 16c0-2.5 1.34-5.21 3-7z" fill="currentColor"/>
            </svg>
            <span>Circuito Saquarema Verde</span>
        </a>

        <div class="actions-group">
            <a href="index.html">Início</a>
        </div>
    </header>

    <div class="main-content">
  <h1>LOGIN</h1>
  <form id="loginForm">
    <div class="form-group">
      <label for="user">Usuário:</label>
      <input id="user" type="text" autocomplete="username" required />
    </div>
    <div class="form-group">
      <label for="pass">Senha:</label>
      <input id="pass" type="password" autocomplete="current-password" required />
    </div>
    <button id="btnLogin" class="login-button" type="submit">Entrar</button>
    <p id="loginMessage" role="status" aria-live="polite"></p>
  </form>
</div>


<script defer src="assets/js/main.js" data-page="admin"></script>
</body>
</html>
